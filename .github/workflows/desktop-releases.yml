name: Portable desktop downloads
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Audit desktop Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r companion/requirements.txt

  package:
    needs: quality-gate
    permissions:
      contents: read
      id-token: write # Short-lived Azure OIDC token; no stored signing keys.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packager and companion dependencies
        run: python -m pip install -r companion/requirements.txt pyinstaller
      - name: Create self-contained portable executable
        run: pyinstaller --clean --onefile --name mightora-clicker-${{ matrix.name }} companion/clicker.py
      - name: Verify executable starts successfully
        shell: bash
        run: |
          if [[ "${{ matrix.name }}" == "windows" ]]; then
            ./dist/mightora-clicker-windows.exe --help
          else
            ./dist/mightora-clicker-${{ matrix.name }} --help
          fi
      - name: Check Artifact Signing configuration
        if: matrix.name == 'windows' && vars.ARTIFACT_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $required = @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'SIGNING_ENDPOINT', 'SIGNING_ACCOUNT', 'SIGNING_PROFILE')
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Artifact Signing is enabled but $name is not configured. Publication is blocked."
            }
          }
      - name: Sign in to Azure with OpenID Connect
        if: matrix.name == 'windows' && vars.ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows EXE with Azure Artifact Signing
        if: matrix.name == 'windows' && vars.ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\mightora-clicker-windows.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify signed executable and timestamp
        if: matrix.name == 'windows' && vars.ARTIFACT_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $file = Join-Path $env:GITHUB_WORKSPACE 'dist/mightora-clicker-windows.exe'
          $signature = Get-AuthenticodeSignature -FilePath $file -ErrorAction Stop
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            throw "Windows executable signature verification failed: $($signature.Status)"
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw 'Windows executable has no verified signing timestamp.'
          }
          Write-Host "Verified Authenticode publisher: $($signature.SignerCertificate.Subject)"
      - name: Record Windows signing status for release notes
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ vars.ARTIFACT_SIGNING_ENABLED }}
        run: |
          if ($env:SIGNING_ENABLED -eq 'true') {
            'signed-and-verified' | Set-Content -Path 'dist/windows-signing-status.txt'
          } else {
            'unsigned' | Set-Content -Path 'dist/windows-signing-status.txt'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: mightora-clicker-${{ matrix.name }}
          path: |
            dist/mightora-clicker-*
            dist/windows-signing-status.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality-gate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mightora-clicker-*
          path: release
          merge-multiple: true
      - name: Create SHA-256 checksums
        run: |
          cd release
          sha256sum mightora-clicker-* > SHA256SUMS.txt
      - name: Describe the actual Windows signing state
        shell: bash
        run: |
          test -f release/windows-signing-status.txt
          # The marker is written on Windows, so normalise CRLF before comparing.
          SIGNING_STATUS="$(tr -d '\r\n' < release/windows-signing-status.txt)"
          if [[ "$SIGNING_STATUS" == 'signed-and-verified' ]]; then
            SIGNING_NOTE='**Windows EXE: digitally signed and timestamped using Microsoft Azure Artifact Signing.** The release workflow verified its Authenticode signature before publication.'
          elif [[ "$SIGNING_STATUS" == 'unsigned' ]]; then
            SIGNING_NOTE='**Windows EXE: unsigned.** SmartScreen or organisational policy may warn or block it. Artifact Signing is not yet activated for this repository.'
          else
            echo 'Unknown Windows signing state; refusing to publish.' >&2
            exit 1
          fi
          {
            echo 'Portable companions for Windows, macOS and Linux. No Python installation required.'
            echo
            echo "$SIGNING_NOTE"
            echo
            echo 'macOS and Linux companions are unsigned. Only run software from a source you trust. SHA256SUMS.txt contains checksums for verifying downloads, calculated after any signing step.'
            echo
            echo 'A valid signature identifies the publisher and protects file integrity; it does not guarantee that SmartScreen will allow a new app immediately.'
            echo
            echo 'View the source, automated checks and licence in this repository.'
          } > release/RELEASE_NOTES.md
      - name: Publish versioned public desktop downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Mightora Clicker v1.0.${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          body_path: release/RELEASE_NOTES.md
          files: |
            release/mightora-clicker-*
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
