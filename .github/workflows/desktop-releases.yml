name: Portable desktop downloads
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Audit desktop Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r companion/requirements.txt

  package:
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packager and companion dependencies
        run: python -m pip install -r companion/requirements.txt pyinstaller
      - name: Create self-contained portable executable
        run: pyinstaller --clean --onefile --name mightora-clicker-${{ matrix.name }} companion/clicker.py
      - name: Verify executable starts successfully
        shell: bash
        run: |
          if [[ "${{ matrix.name }}" == "windows" ]]; then
            ./dist/mightora-clicker-windows.exe --help
          else
            ./dist/mightora-clicker-${{ matrix.name }} --help
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mightora-clicker-${{ matrix.name }}
          path: dist/mightora-clicker-*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality-gate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mightora-clicker-*
          path: release
          merge-multiple: true
      - name: Create SHA-256 checksums
        run: |
          cd release
          sha256sum mightora-clicker-* > SHA256SUMS.txt
      - name: Publish versioned public desktop downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Mightora Clicker v1.0.${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          body: |
            Portable companions for Windows, macOS and Linux. No Python installation required.

            **These executables are currently unsigned.** They may trigger SmartScreen, Gatekeeper or organisation policy restrictions. Only run software from a source you trust. SHA256SUMS.txt contains checksums for verifying downloads.

            View the source, checks and licence in this repository. A valid code-signing certificate is required before these can be described as signed or trusted-publisher downloads.
          files: |
            release/mightora-clicker-*
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
