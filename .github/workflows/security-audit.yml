name: Security audit
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Install Python security tools
        run: python -m pip install pip-audit bandit ruff
      - name: Python dependency audit
        run: python -m pip_audit -r companion/requirements.txt
      - name: Python static security checks
        run: |
          bandit -q -r companion -ll
          ruff check companion/clicker.py --select E4,E7,E9,F,S
